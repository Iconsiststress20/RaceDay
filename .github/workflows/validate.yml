name: Validate RaceDay Repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required folders and files
        run: |
          test -d docs
          test -f docs/RACEDAY.sql
          echo "RaceDay repository structure is valid."